<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Introduction</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Registry</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse nav justify-content-end" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <h2 class="text-center text-warning">Registration Form</h2>
        <form class="border p-4 shadow-sm bg-light form-inline">
            <div class="row">
                <div class="col mb-3">
                    <label for="text" class="form-label ">First Name</label>
                    <input type="text" class="form-control" id="fname" placeholder="enter first name">
                </div>
            
                <div class="col mb-3">
                    <label for="text" class="form-label">Last Name</label>
                    <input type="text" class="form-control" id="lname" placeholder="enter last name">
                </div>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email address</label>
                <input type="email" class="form-control" id="email" placeholder="Enter your email" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" placeholder="Enter your password" required>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" value="" id="agree">
                <label class="form-check-label" for="agree">
                  Do you agree with the terms of service?
                </label>
              </div>
            <button type="submit" class="btn btn-success w-100">Submit</button>
        </form>
    </div>

    <div class="container mt-5 table-responsive">
        <h2 class="text-center text-success">User Data</h2>
        <table class="table table-striped table-hover border">
            <thead class="table-primary">
                <tr>
                    <th>#</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Password</th>
                </tr>
            </thead>
            <tbody class="table-dark">
                <tr>
                    <td>1</td>
                    <td>Jane Doe</td>
                    <td>jane.doe@example.com</td>
                    <td>Jdoe123</td>
                </tr>
                <tr>
                    <td>2</td>
                    <td>John Smith</td>
                    <td>john.smith@example.com</td>
                    <td>Jsmith123</td>
                </tr>
                <tr>
                    <td>3</td>
                    <td>Kate Miller</td>
                    <td>kate.miller@example.com</td>
                    <td>Kmiller123</td>
                </tr>
            </tbody>
        </table>
    </div>
    <div class="container-fluid mt-5">
        <img src="assets/StockCake-Coder's Night Setup_1746249877.jpg" class="img-fluid" alt="Responsive Image">
        <img src="assets/StockCake-Striding Through Color_1746250546.jpg" class="img-fluid rounded-circle" alt="circular image">
    </div>
    <div class="container mt-5">
        <button class="btn btn-warning fw-bold text-success border-success d-block mx-auto col-4">Always Here</button>
        <button class="btn btn-danger fw-bold text-primary border-primary mx-auto col-4 mt-5 d-md-block d-none">Mostly Here</button>
    </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
